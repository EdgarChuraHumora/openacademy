# Revisa una vez al mes si hay versiones nuevas o arreglos de seguridad en las librerías
# y abre un pull request agrupado por carpeta (así no llegan decenas de avisos sueltos)
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ['*']
